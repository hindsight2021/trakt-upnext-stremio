services:
  trakt-upnext:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - TRAKT_REDIRECT_URI=${TRAKT_REDIRECT_URI}
